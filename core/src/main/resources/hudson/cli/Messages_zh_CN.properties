DisablePluginCommand.PrintUsageSummary=根据短名称禁用插件。可以指定如何处理依赖插件，以及是否在操作后重启。也可以启用静默模式以避免控制台输出额外信息。
DisablePluginCommand.ShortDescription=禁用一个或多个已安装的插件。
DisablePluginCommand.StatusMessage=正在禁用“{0}”：{1}（{2}）
SafeRestartCommand.ShortDescription=安全重启 Jenkins，不再启动新的构建。
