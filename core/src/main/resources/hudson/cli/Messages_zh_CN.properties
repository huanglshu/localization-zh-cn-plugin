BuildCommand.PrintUsageSummary=启动构建，并可选择等待其完成。除了常规脚本用途，还可在一个任务的构建中调用另一个任务。使用 -s 时，命令退出码根据构建结果决定（0 表示成功），中断命令也会中断任务。使用 -f 时，退出码也根据构建结果决定，但中断命令不会中断任务（125 表示命令被中断）。使用 -c 时，仅在源码管理发生变更时运行构建。
