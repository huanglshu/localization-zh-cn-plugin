blurb=<tt>JENKINS_HOME</tt> 就快要空间不足了
description.2=要解决这个问题，你应该现在就有所行动。
solution.1=清理一下这个磁盘分区以便腾出更多的空间。
JENKINS_HOME\ is\ almost\ full=JENKINS_HOME 空间即将耗尽
description.1=您的 <code>JENKINS_HOME</code>（{0}）空间即将耗尽。目录空间完全用尽后，Jenkins 将无法存储更多数据并可能出现严重问题。
solution.2=将 <code>JENKINS_HOME</code> 移至更大的分区。操作方法请参阅<a href="https://www.jenkins.io/redirect/migrate-jenkins-home">文档</a>。
