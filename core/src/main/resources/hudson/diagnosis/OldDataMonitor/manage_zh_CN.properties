blurb.1=当磁盘上的数据存储结构发生变化时，Jenkins 在加载数据时将其迁移到新结构，但不会自动以新格式重新保存项目或记录，以便必要时降级。这可能导致磁盘上的旧格式数据长期存在。下表列出包含此类数据的项目或记录，以及数据结构发生变化的 Jenkins 版本。
blurb.2=读取数据时有时会出错，例如添加数据的插件后来被禁用、结构变更没有迁移代码，或 Jenkins 降级后无法读取已写入的数据。Jenkins 会记录错误并跳过无法读取的数据，以便正常启动和运行。
blurb.3=可以使用下方表单将这些项目或记录更新为当前格式。更新后，低于所选版本的 Jenkins 或插件将无法读取新格式的数据。即使不使用此表单，创建和配置任务或运行构建也可能保存旧版本无法读取的数据。上表右侧报告的无法读取的数据将在重新保存时丢失。
blurb.4=支持这些数据迁移的代码最终可能被移除。结构变更后将至少兼容 150 个 Jenkins 版本。超过该范围的版本在上方以粗体显示，建议重新保存相关项目或记录。
blurb.5=（仍可能降级至所选版本）
blurb.6=可以保留这些项目或记录中无法读取的数据，Jenkins 会忽略它们。若要避免 Jenkins 启动时记录相关日志，可使用列表下方的按钮重新保存项目或记录，永久删除无法读取的数据。
Resave\ data\ files\ with\ structure\ changes\ no\ newer\ than\ Jenkins=重新保存结构变更不晚于指定 Jenkins 版本的数据文件
