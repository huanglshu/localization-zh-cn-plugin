Legend=图标说明
online=节点在线，且有空闲执行器时会接受任务。
offline=以上情况均不适用。节点未连接，或虽然仍已连接，但节点监视器判定其状态异常。请检查此节点。
paused=节点因配置的保留策略而离线。需要时（例如有新任务请求时）会重新上线。
temp-offline=用户已将节点设为暂时离线。如果节点仍已连接，正在运行的任务会继续执行。用户重新将节点上线之前不会启动新任务。
not-accepting=节点当前不接受任务。通常是节点可用性设置阻止了任务执行，例如按计划上线的节点当前不在允许的时间范围内。已开始的任务仍可能继续执行。仅运行单个任务的云节点也可能处于此状态。<br/>这些节点在“构建执行器状态”组件中显示为“已暂停”。
Status=状态
