configure.link.text=配置链接
Connect\ agent\ to\ Jenkins\ one\ of\ these\ ways\:=节点连接Jenkins的方式如下：
launch\ agent=启动节点
Launch\ agent\ from\ browser=在浏览器中启动节点
Run\ from\ agent\ command\ line\:=在命令行中启动节点
Or\ if\ the\ agent\ is\ headless\:=或者，当节点是无界面的话
Connected\ via\ JNLP\ agent.=已通过JNLP Agent连接
commonOptions=如果希望使用 TCP 而不是 WebSocket，请移除 <code>-webSocket</code> 选项。运行 <code>java -jar agent.jar -help</code> 查看更多信息。
install-instance-identity=立即安装
instance-identity-missing=似乎缺少 <code>instance-identity</code> 插件，TCP 节点将无法连接。您仍可使用 WebSocket 节点。
powerShell.cli.curl=注意：PowerShell 用户必须使用 curl.exe 而不是 curl，因为 curl 默认是 Invoke-WebRequest 的别名。
slaveAgent.cli.run=在节点命令行中运行：
slaveAgent.cli.run.secret=或者将密钥保存在文件中，然后在节点命令行中运行：
slaveAgent.connected=节点已连接。
tcp-port-disabled=TCP 端口已禁用，因此 TCP 节点无法连接。您仍可使用 WebSocket 节点。
web-socket-unsupported=此 Jenkins 安装不支持 WebSocket。您仍可使用 TCP 节点。
