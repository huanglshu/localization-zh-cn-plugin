para1=适用于使用 Maven 作为构建系统的项目。Jenkins 将以指定的目标和选项调用 Maven。Maven 返回非零退出码时，Jenkins 会将构建标记为失败。部分 Maven 版本存在无法正确返回退出码的问题。
para2=Jenkins 会向 Maven 传递<a href="{0}/env-vars.html">各种环境变量</a>，您可以在 Maven 中通过 "$&#123;env.VARIABLENAME}" 访问。
para3=相同的变量也可用于命令行参数，就像在 Shell 中调用一样。例如，可以指定 <code>-DresultsFile=$&#123;WORKSPACE}/$&#123;BUILD_TAG}.results.txt</code>。
