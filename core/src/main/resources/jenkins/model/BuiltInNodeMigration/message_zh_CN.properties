Apply\ Migration=应用迁移
blurb=Jenkins 主进程和内置节点将不再使用“master”这一名称。主进程现在称为“控制节点”，内置节点称为“内置节点”。界面已相应更新，以下功能也会受到影响：<ul><li>内置节点的隐式标签从 <code>master</code> 改为 <code>built-in</code>。</li><li>内置节点的 <code>NODE_NAME</code> 环境变量也从 <code>master</code> 改为 <code>built-in</code>。</li></ul>这些变更可能影响构建行为，因此不会自动应用。应用之前，请检查：<ul><li>任务配置和工具安装程序中使用 <code>master</code> 标签的位置。迁移后这些标签将不再匹配内置节点。除了更新配置，也可以显式为内置节点添加 <code>master</code> 标签。</li><li>构建脚本中对 <code>NODE_NAME</code> 环境变量的使用。</li></ul><a href="https://www.jenkins.io/redirect/built-in-node-migration" rel="noopener noreferrer" target="_blank">了解更多。</a>
