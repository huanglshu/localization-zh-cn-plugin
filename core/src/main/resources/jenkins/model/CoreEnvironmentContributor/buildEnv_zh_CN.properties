BUILD_DISPLAY_NAME.blurb=当前构建的显示名称，默认类似于“#153”。
BUILD_ID.blurb=当前构建 ID。Jenkins 1.597 及之后创建的构建与 BUILD_NUMBER 相同，较早构建则为 YYYY-MM-DD_hh-mm-ss 时间戳。
BUILD_NUMBER.blurb=当前构建编号，例如“153”。
BUILD_TAG.blurb=格式为“jenkins-<i>$'{'JOB_NAME}</i>-<i>$'{'BUILD_NUMBER}</i>”的字符串。JOB_NAME 中的正斜杠（“/”）会替换为连字符（“-”）。可将其放入资源文件或 JAR 文件等，以便识别。
BUILD_URL.blurb=此构建的完整 URL，例如 <code>http://server:port/jenkins/job/foo/15/</code>（必须设置<i>Jenkins URL</i>）。
CI.blurb=固定设为字符串“true”，表示持续集成执行环境。
EXECUTOR_NUMBER.blurb=执行此构建的执行器在同一计算机上的唯一编号。它与“构建执行器状态”中显示的编号对应，但从 0 而不是 1 开始。
JENKINS_HOME.blurb=控制节点文件系统中供 Jenkins 存储数据的目录绝对路径。
JENKINS_URL.blurb=Jenkins 的完整 URL，例如 <code>http://server:port/jenkins/</code>（仅在系统配置中设置<i>Jenkins URL</i>时可用）。
JOB_BASE_NAME.blurb=此构建所属项目的短名称，不包含文件夹路径，例如“bar/foo”的短名称为“foo”。
JOB_NAME.blurb=此构建所属项目的名称，例如“foo”或“foo/bar”。
JOB_URL.blurb=此任务的完整 URL，例如 <code>http://server:port/jenkins/job/foo/</code>（必须设置<i>Jenkins URL</i>）。
NODE_LABELS.blurb=分配给节点的标签列表，以空白字符分隔。
NODE_NAME.blurb=在节点上构建时为节点名称；在内置节点上构建时为“built-in”（Jenkins 2.306 及之前为“master”）。
WORKSPACE.blurb=分配给构建作为工作区的目录绝对路径。
WORKSPACE_TMP.blurb=工作区附近的临时目录，不可浏览，也不会干扰源码检出。该目录初始时可能不存在，请按需创建（例如在 Linux 上使用 <code>mkdir -p</code>）。普通工作区为驱动器根目录时不定义此变量。
