blue=上次构建成功。
blue_anime=上次构建成功。新的构建正在进行。
darkgrey=上次构建已中止。
darkgrey_anime=上次构建已中止。新的构建正在进行。
grey=项目已禁用。
grey_anime=项目已禁用，但构建正在进行。
health-00to20=项目健康度不超过 20%
health-21to40=项目健康度高于 20% 且不超过 40%
health-41to60=项目健康度高于 40% 且不超过 60%
health-61to80=项目健康度高于 60% 且不超过 80%
health-81plus=项目健康度高于 80%
lightgrey=项目尚未构建。
lightgrey_anime=首次构建正在进行。
red=上次构建失败。
red_anime=上次构建失败。新的构建正在进行。
running=构建正在进行。
yellow=上次构建成功但不稳定，通常表示测试失败。
yellow_anime=上次构建成功但不稳定。新的构建正在进行。
Project\ Health=项目健康度
Status=状态
