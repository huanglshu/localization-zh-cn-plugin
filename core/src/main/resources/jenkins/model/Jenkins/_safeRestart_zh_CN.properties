cannotRestart=当前配置下 Jenkins 无法自行重启。
description=此消息将显示在大多数 Jenkins 页面上，可用于告知用户当前情况。如果不填写，将显示默认消息。
restartWarning=Jenkins 将尝试暂停任务，并在所有运行中的任务完成或暂停后重启。（某些情况下 Pipeline 构建可能会暂时阻止重启；它们将在下一个可用时机暂停，并在 Jenkins 重启后继续。）
Cancel=取消
Restart=重启
