Title=什么是“项目关系”？
body=当项目相互依赖时，Jenkins 可通过<a href="https://www.jenkins.io/redirect/fingerprint">指纹功能</a>创建的记录，跟踪下游项目的哪个构建使用了上游项目的哪个构建。
For\ this\ feature\ to\ work,\ the\ following\ conditions\ need\ to\ be\ met\:=要使用此功能，必须满足以下条件：
The\ downstream\ project\ records\ the\ fingerprints\ of\ the\ upstream\ files\ it\ uses.=下游项目记录其使用的上游文件的指纹。
The\ upstream\ project\ records\ the\ fingerprints\ of\ its\ build\ artifacts.=上游项目记录其构建产物的指纹。
This\ allows\ Jenkins\ to\ correlate\ two\ projects.=这样 Jenkins 便可以关联两个项目。
