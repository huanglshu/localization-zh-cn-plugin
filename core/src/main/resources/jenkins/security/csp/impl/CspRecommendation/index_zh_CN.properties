Cancel=取消
Content\ Security\ Policy\ configuration=内容安全策略配置
Go\ to\ configuration=前往配置
paragraph1=内容安全策略是一种安全机制，可减少或消除跨站脚本（XSS）等 Web 安全漏洞的影响。
paragraph2=大多数常用 Jenkins 插件都兼容 Jenkins 默认规则，但当前安装的插件未必全部兼容。如果强制执行内容安全策略后 Jenkins 界面出现问题，可以使用 Java 系统属性 <code>jenkins.security.csp.CspHeader.headerName</code>，将其设置为 <code>Content-Security-Policy-Report-Only</code> 后启动 Jenkins，以再次禁用保护。
paragraph3=如需了解如何判断当前配置是否兼容内容安全策略，请访问<a href="https://www.jenkins.io/redirect/csp-compatibility" target="_blank">文档网站</a>。
Enabling\ Content\ Security\ Policy\ configuration=启用内容安全策略配置
