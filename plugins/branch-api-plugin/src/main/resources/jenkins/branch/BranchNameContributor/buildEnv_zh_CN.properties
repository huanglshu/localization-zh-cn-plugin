blurb.BRANCH_NAME=对于多分支项目，此变量为正在构建的分支名称。例如，可用于仅从 <code>master</code> 部署到生产环境，而不从功能分支部署。对于变更请求，名称通常是任意的（请参阅 <code>CHANGE_ID</code> 和 <code>CHANGE_TARGET</code>）。
blurb.BRANCH_IS_PRIMARY=对于多分支项目，如果源码管理来源报告正在构建的分支为主分支，此变量设为 <code>"true"</code>；否则不设置。某些来源可能报告多个主分支，其他来源可能不提供此信息。
blurb.CHANGE_ID=对于对应变更请求的多分支项目，如果支持，此变量为变更 ID，例如拉取请求编号；否则不设置。
blurb.CHANGE_URL=对于对应变更请求的多分支项目，如果支持，此变量为变更 URL；否则不设置。
blurb.CHANGE_TITLE=对于对应变更请求的多分支项目，如果支持，此变量为变更标题；否则不设置。
blurb.CHANGE_AUTHOR=对于对应变更请求的多分支项目，如果支持，此变量为变更作者的用户名；否则不设置。
blurb.CHANGE_AUTHOR_DISPLAY_NAME=对于对应变更请求的多分支项目，如果支持，此变量为变更作者的显示名称；否则不设置。
blurb.CHANGE_AUTHOR_EMAIL=对于对应变更请求的多分支项目，如果支持，此变量为变更作者的电子邮件地址；否则不设置。
blurb.CHANGE_TARGET=对于对应变更请求的多分支项目，如果支持，此变量为变更可合并到的目标分支或基础分支；否则不设置。
blurb.CHANGE_BRANCH=对于对应变更请求的多分支项目，此变量为源码管理系统中的实际源分支名称，可能与 <code>BRANCH_NAME</code> 不同。例如在 GitHub 或 Bitbucket 中，它是源分支名称，而 <code>BRANCH_NAME</code> 可能为 <code>PR-24</code>。
blurb.CHANGE_FORK=对于对应变更请求的多分支项目，如果变更来自派生仓库，此变量为派生仓库名称；否则不设置。
blurb.TAG_NAME=对于对应标签的多分支项目，如果支持，此变量为正在构建的标签名称；否则不设置。
blurb.TAG_TIMESTAMP=对于对应标签的多分支项目，如果支持，此变量为自 Unix 纪元以来的标签时间戳（毫秒）；否则不设置。
blurb.TAG_UNIXTIME=对于对应标签的多分支项目，如果支持，此变量为自 Unix 纪元以来的标签时间戳（秒）；否则不设置。
blurb.TAG_DATE=对于对应标签的多分支项目，如果支持，此变量为 <a href="https://docs.oracle.com/javase/7/docs/api/java/util/Date.html#toString()" target="_blank">java.util.Date#toString()</a> 格式的时间戳，例如 Wed Jan 1 00:00:00 UTC 2020；否则不设置。
