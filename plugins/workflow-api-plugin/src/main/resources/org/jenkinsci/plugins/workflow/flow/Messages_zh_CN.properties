FlowDurabilityHint.PERFORMANCE_OPTIMIZED.description=性能优化：速度快得多（需要正常关闭 Jenkins 才能保存运行中的流水线）
FlowDurabilityHint.PERFORMANCE_OPTIMIZED.tooltip=不会在每个步骤都写入数据，也不使用原子写入。正常关闭 Jenkins 后流水线可以恢复，但如果 Jenkins 意外故障，运行中的流水线会丢失步骤信息，且无法恢复。
FlowDurabilityHint.SURVIVABLE_NONATOMIC.description=持久性较低，速度稍快（仅用于特定场景）
FlowDurabilityHint.SURVIVABLE_NONATOMIC.tooltip=在每个步骤写入数据，但不使用原子写入。在某些文件系统上，这比最高持久性模式更快，但磁盘写入中断或失败时，运行中的流水线数据可能丢失。
FlowDurabilityHint.MAX_SURVIVABILITY.description=最高恢复能力和持久性，但速度最慢
FlowDurabilityHint.MAX_SURVIVABILITY.tooltip=在每个步骤使用原子写入保存数据，以保证完整性。Jenkins 发生故障时，此选项最有利于保留和恢复运行中的流水线数据。
